<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Shield Outline -->
  <path d="M 60 12 Q 95 12 95 48 C 95 82 60 108 60 108 C 60 108 25 82 25 48 Q 25 12 60 12 Z" 
        fill="none" stroke="#7B1C1C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M 60 17 Q 90 17 90 48 C 90 78 60 102 60 102 C 60 102 30 78 30 48 Q 30 17 60 17 Z" 
        fill="none" stroke="#7B1C1C" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Cross -->
  <rect x="56" y="24" width="8" height="60" rx="2" fill="#7B1C1C" />
  <rect x="36" y="38" width="48" height="8" rx="2" fill="#7B1C1C" />

  <!-- Anchor Arms -->
  <path d="M 38 68 Q 60 92 82 68" fill="none" stroke="#7B1C1C" stroke-width="5" stroke-linecap="round" />
  <path d="M 34 62 L 38 68 L 44 65" fill="none" stroke="#7B1C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 86 62 L 82 68 L 76 65" fill="none" stroke="#7B1C1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Anchor Ring at top of Cross -->
  <circle cx="60" cy="22" r="6" fill="none" stroke="#7B1C1C" stroke-width="3" />

  <!-- Rope wrapping around Anchor / Cross -->
  <path d="M 60 28 Q 72 36 60 46 Q 48 56 60 66 Q 72 76 60 84" 
        fill="none" stroke="#7B1C1C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 2" />

  <!-- Bottom Ribbon Scroll -->
  <path d="M 15 96 Q 60 114 105 96 L 98 108 Q 60 120 22 108 Z" fill="#7B1C1C" opacity="0.15" />
  <path d="M 18 98 Q 60 112 102 98" fill="none" stroke="#7B1C1C" stroke-width="3" stroke-linecap="round" />
</svg>
